[package]
name = "kodkod-desktop-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional user-session Wayland desktop helper for Kodkod Executor"

[features]
default = []
portal = ["dep:ashpd", "dep:pipewire", "dep:reis", "dep:zbus", "dep:xkbcommon"]

[[bin]]
name = "kodkod-desktop-helper"
path = "src/main.rs"
required-features = ["portal"]

[dependencies]
kodkod-executor = { path = "../kodkod-executor", version = "0.1.0" }
anyhow = "1"
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.12.3", default-features = false, features = ["tokio"], optional = true }
pipewire = { version = "0.8", features = ["v0_3_44"], optional = true }
reis = { version = "=0.7.1", features = ["tokio"], optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
libc = "0.2"
xkbcommon = { version = "0.8", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
