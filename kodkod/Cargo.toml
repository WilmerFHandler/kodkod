[package]
name = "kodkod"
version = "0.1.0"
edition = "2024"
description = "A small provider-agnostic agent loop with tool calling support."
license = "MIT"
readme = "../kodkod-core/README.md"
repository = "https://github.com/WilmerFHandler/kodkod"
keywords = ["agent", "llm", "tools"]
categories = ["asynchronous"]

[features]
default = []
executor = ["dep:kodkod-executor"]
openai = ["dep:kodkod-openai", "dep:kodkod-http"]
anthropic = ["dep:kodkod-anthropic", "dep:kodkod-http"]
google = ["dep:kodkod-google", "dep:kodkod-http"]
http = ["dep:kodkod-http"]
providers = [
    "dep:kodkod-providers",
    "http",
    "openai",
    "anthropic",
    "google",
]

[dependencies]
kodkod-executor = { path = "../kodkod-executor", optional = true, version = "0.1.0" }
kodkod-core = { path = "../kodkod-core", version = "0.1.0" }
kodkod-http = { path = "../kodkod-http", optional = true, version = "0.1.0" }
kodkod-openai = { path = "../kodkod-openai", optional = true, version = "0.1.0" }
kodkod-anthropic = { path = "../kodkod-anthropic", optional = true, version = "0.1.0" }
kodkod-google = { path = "../kodkod-google", optional = true, version = "0.1.0" }
kodkod-providers = { path = "../kodkod-providers", optional = true, version = "0.1.0" }
